name: hippie_turismo
description: Aplicativo de descoberta turística por proximidade.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0
  flutter_local_notifications: ^19.5.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  http: ^1.6.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/places/
